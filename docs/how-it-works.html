<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How polyship ships a branch</title>
  <!-- Font source: system. No Google Fonts link: the exported SVG is shown on GitHub through <img>, which loads no external fonts. -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · polyship</p>
    <h1>How ship.sh lands a branch</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 544" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
        <title id="how-it-works-title">How ship.sh lands a branch</title>
        <desc id="how-it-works-desc">Many agents work in parallel worktrees; each commits, gets an optional agent review and runs the tests, then waits for one repository lock, under which merge.sh rebases onto the target, runs the pre-merge tests again and brings the branch into the target with a merge commit; a rebase conflict releases the lock, an agent resolves it and the branch queues again, or the owner is asked when two product behaviors are incompatible.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones (painted first) -->
        <!-- A: one worktree per agent, drawn as a deck of N -->
        <rect x="56" y="40" width="608" height="120" rx="8" fill="#f5f5f5" stroke="rgba(45,49,66,0.18)" stroke-width="1"/>
        <rect x="48" y="48" width="608" height="120" rx="8" fill="#f5f5f5" stroke="rgba(45,49,66,0.24)" stroke-width="1"/>
        <rect x="40" y="56" width="608" height="120" rx="8" fill="#f5f5f5" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="56" y="76" fill="#5a6580" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">IN EACH WORKTREE · N AGENTS IN PARALLEL</text>

        <!-- B: merge.sh under one lock for the whole repository -->
        <rect x="40" y="228" width="608" height="116" rx="8" fill="rgba(191,69,32,0.05)" stroke="#bf4520" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="632" y="248" fill="#bf4520" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em" text-anchor="end">MERGE.SH · ONE LOCK PER REPOSITORY · ONE SESSION AT A TIME</text>

        <!-- Arrows (before nodes) -->
        <path d="M224 116 H264" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M424 116 H464" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <!-- tests → queue → rebase -->
        <path d="M544 144 V196 Q544 204 536 204 H152 Q144 204 144 212 V264" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="244" y="186" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="280" y="195" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WAIT FOR LOCK</text>
        <!-- waiting sessions on the queue -->
        <rect x="352" y="198" width="12" height="12" rx="2" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
        <rect x="372" y="198" width="12" height="12" rx="2" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
        <rect x="392" y="198" width="12" height="12" rx="2" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>

        <path d="M224 292 H264" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M424 292 H464" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M624 292 H720" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

        <!-- conflict loop: out of the lock and back into the queue -->
        <path d="M112 320 V408" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="56" y="370" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="80" y="379" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CONFLICT</text>
        <path d="M176 408 V320" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="184" y="370" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="212" y="379" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NEXT ROUND</text>

        <path d="M224 436 H320" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="240" y="418" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="272" y="427" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">INCOMPATIBLE</text>

        <!-- Nodes -->
        <!-- 1. start: the agent commits -->
        <rect x="64" y="88" width="160" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="64" y="88" width="160" height="56" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="144" y="113" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Agent commits</text>
        <text x="144" y="129" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">intent in the message</text>

        <!-- 2. review (optional, agent) -->
        <rect x="264" y="88" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="88" width="160" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.45)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="272" y="94" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="290" y="103" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="344" y="121" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Review and fix</text>
        <text x="344" y="135" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SHIP_REVIEW=0 skips</text>

        <!-- 3. tests -->
        <rect x="464" y="88" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="464" y="88" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="544" y="113" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Tests</text>
        <text x="544" y="129" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SHIP_TEST</text>

        <!-- 4. rebase -->
        <rect x="64" y="264" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="264" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="144" y="289" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Rebase onto target</text>
        <text x="144" y="305" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">wt merge</text>

        <!-- 5. tests again -->
        <rect x="264" y="264" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="264" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="344" y="289" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Tests again</text>
        <text x="344" y="305" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">[pre-merge] hook</text>

        <!-- 6. merge commit -->
        <rect x="464" y="264" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="464" y="264" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="544" y="289" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Merge commit</text>
        <text x="544" y="305" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">--no-ff, MERGE_PUSH pushes</text>

        <!-- 7. end: on the target (focal) -->
        <rect x="720" y="264" width="160" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="720" y="264" width="160" height="56" rx="20" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="800" y="289" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Branch on target</text>
        <text x="800" y="305" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">exit 0</text>

        <!-- 8. resolve conflict (agent, outside the lock) -->
        <rect x="64" y="408" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="64" y="408" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="72" y="414" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="90" y="423" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="144" y="441" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Resolve conflict</text>
        <text x="144" y="455" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reads commit intent</text>

        <!-- 9. end: the owner decides -->
        <rect x="320" y="408" width="160" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="320" y="408" width="160" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.40)" stroke-width="1"/>
        <text x="400" y="433" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Ask the owner</text>
        <text x="400" y="449" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">exit 3 · rebase left open</text>

        <!-- Callouts -->
        <text font-size="14" font-style="italic" fill="#4f5d75" font-family="'Instrument Serif', 'Noto Serif', serif">
          <tspan x="696" y="100">Every agent ships its own</tspan>
          <tspan x="696" y="120">branch. Review and tests</tspan>
          <tspan x="696" y="140">run in all worktrees at once.</tspan>
        </text>
        <text font-size="14" font-style="italic" fill="#4f5d75" font-family="'Instrument Serif', 'Noto Serif', serif">
          <tspan x="528" y="420">A conflict releases the lock. The agent</tspan>
          <tspan x="528" y="440">resolves it, and the branch queues again,</tspan>
          <tspan x="528" y="460">up to 10 rounds.</tspan>
        </text>

        <!-- Legend -->
        <line x1="40" y1="496" x2="920" y2="496" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="524" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="112" y="512" width="24" height="16" rx="4" fill="rgba(191,69,32,0.05)" stroke="#bf4520" stroke-opacity="0.6" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="144" y="524" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">under the repository lock</text>

        <rect x="292" y="514" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="310" y="523" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="336" y="524" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">ship.sh runs an agent</text>

        <rect x="456" y="512" width="24" height="16" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.45)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="488" y="524" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">optional step</text>

        <rect x="572" y="512" width="24" height="16" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="604" y="524" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">start or exit</text>

        <rect x="684" y="514" width="12" height="12" rx="2" fill="#f5f5f5" stroke="#4f5d75" stroke-width="1"/>
        <text x="704" y="524" fill="#4f5d75" font-size="9" font-family="'Geist', system-ui, sans-serif">a session waiting for the lock</text>
      </svg>
    </div>
  </div>
</body>
</html>
